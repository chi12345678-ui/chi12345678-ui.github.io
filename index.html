<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阿历 · 数据分析成长博客</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       所有样式（来自 style.css，完整版）
       ============================================================ */
    :root {
      --bg: #faf9f8;
      --bg-card: #ffffff;
      --bg-input: #f5f4f3;
      --text: #1a1a1a;
      --text-secondary: #4a4a4a;
      --text-muted: #8a8a8a;
      --border: #e5e5e5;
      --border-light: #f0efee;
      --primary: #e8730c;
      --primary-hover: #d0650a;
      --success: #2ecc71;
      --danger: #c0392b;
      --danger-hover: #a93226;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
      --radius: 10px;
      --font: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
      --sidebar-width: 240px;
      --nav-height: 56px;
      --transition: 0.25s ease;
    }
    [data-theme="dark"] {
      --bg: #141414;
      --bg-card: #1e1e1e;
      --bg-input: #2a2a2a;
      --text: #e8e8e8;
      --text-secondary: #b0b0b0;
      --text-muted: #707070;
      --border: #333333;
      --border-light: #282828;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { font-size:16px; scroll-behavior:smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: background var(--transition), color var(--transition);
      line-height: 1.7;
    }
    a { color: var(--primary); text-decoration:none; }
    a:hover { color: var(--primary-hover); }
    img { max-width:100%; height:auto; display:block; }
    button { cursor:pointer; border:none; background:none; font:inherit; color:inherit; }

    .sidebar {
      position: fixed; top:0; left:0; bottom:0;
      width: var(--sidebar-width);
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform 0.3s ease;
    }
    .sidebar-brand { margin-bottom: 40px; }
    .sidebar-brand .brand-link { font-size:1.6rem; font-weight:700; color:var(--text); }
    .sidebar-brand .brand-sub { display:block; font-size:0.85rem; color:var(--text-muted); }
    .sidebar-nav { flex:1; }
    .sidebar-nav ul { list-style:none; }
    .sidebar-nav li { margin-bottom:2px; }
    .sidebar-nav a {
      display:flex; align-items:center; padding:8px 12px;
      border-radius:6px; color:var(--text-secondary); font-weight:500;
      transition: all var(--transition);
    }
    .sidebar-nav a i { width:28px; text-align:center; }
    .sidebar-nav a:hover { background:var(--border); color:var(--text); }
    .sidebar-nav a.active { background:var(--primary); color:#fff; }
    .sidebar-footer {
      margin-top:auto; padding-top:16px; border-top:1px solid var(--border);
      display:flex; justify-content:space-between; align-items:center;
      font-size:0.85rem; color:var(--text-muted);
    }

    .top-nav {
      display:none;
      position:fixed; top:0; left:0; right:0;
      height:var(--nav-height);
      background:var(--bg-card);
      border-bottom:1px solid var(--border);
      z-index:200;
      padding:0 16px;
      align-items:center;
      justify-content:space-between;
    }
    .top-nav .brand-link { font-size:1.2rem; font-weight:700; color:var(--text); }
    .top-nav .nav-actions { display:flex; align-items:center; gap:8px; }
    .hamburger { font-size:1.4rem; padding:6px 10px; border-radius:6px; }
    .hamburger:hover { background:var(--border); }
    .nav-menu {
      display:none;
      position:absolute; top:var(--nav-height); left:0; right:0;
      background:var(--bg-card); border-bottom:1px solid var(--border);
      flex-direction:column; padding:16px; list-style:none; gap:2px;
      box-shadow:var(--shadow-md);
    }
    .nav-menu.open { display:flex; }
    .nav-menu a { padding:10px 14px; border-radius:6px; color:var(--text-secondary); font-weight:500; }
    .nav-menu a:hover { background:var(--border); }
    .nav-menu a.active { background:var(--primary); color:#fff; }
    .nav-menu .theme-toggle { margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }

    .main-content {
      margin-left: var(--sidebar-width);
      padding: 40px 32px;
      min-height:100vh;
      max-width: 900px;
    }
    .view { display:none; animation:fadeUp 0.3s ease; }
    .view.active { display:block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    .hero { padding:32px 0 40px; }
    .hero h1 { font-size:2.6rem; font-weight:700; letter-spacing:-0.02em; line-height:1.2; }
    .hero .hero-sub { font-size:1.2rem; color:var(--text-secondary); margin:8px 0 12px; }
    .hero .hero-desc { font-size:1.05rem; color:var(--text-secondary); max-width:560px; }
    .section { margin:48px 0; }
    .section-title { font-size:1.6rem; font-weight:600; margin-bottom:20px; }
    .section-title::after { content:''; display:block; width:40px; height:3px; background:var(--primary); border-radius:2px; margin-top:6px; }
    .link-more { display:inline-block; margin-top:8px; font-weight:500; }

    .post-list { display:flex; flex-direction:column; gap:0; }
    .post-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 0; border-bottom:1px solid var(--border-light); gap:12px;
    }
    .post-item:last-child { border-bottom:none; }
    .post-item .post-title { font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .post-item .post-preview { font-size:0.9rem; color:var(--text-muted); flex:2; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .post-item .post-meta, .post-item .post-time { font-size:0.85rem; color:var(--text-muted); white-space:nowrap; flex-shrink:0; }
    .post-item .post-status { font-size:0.75rem; padding:2px 10px; border-radius:20px; flex-shrink:0; }
    .post-item .post-status.status-published { background:var(--success); color:#fff; }
    .post-item .post-status.status-draft { background:var(--border); color:var(--text-muted); }
    .post-item .post-actions { display:flex; gap:4px; flex-shrink:0; }
    .post-item .post-item-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
    .post-item .post-item-meta { display:flex; align-items:center; gap:12px; flex-shrink:0; }

    .life-list { display:flex; flex-direction:column; gap:16px; }
    .life-item {
      background:var(--bg-card); border-radius:var(--radius);
      padding:20px; border:1px solid var(--border); box-shadow:var(--shadow-sm);
    }
    .life-item:hover { box-shadow:var(--shadow-md); }
    .life-item .life-text { font-size:1rem; line-height:1.7; color:var(--text-secondary); }
    .life-images { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
    .life-images img { border-radius:6px; aspect-ratio:1; object-fit:cover; }
    .life-item-meta { display:flex; align-items:center; gap:12px; margin-top:12px; padding-top:8px; border-top:1px solid var(--border-light); }
    .life-item .life-status { font-size:0.75rem; padding:2px 10px; border-radius:20px; }
    .life-item .life-status.status-published { background:var(--success); color:#fff; }
    .life-item .life-status.status-draft { background:var(--border); color:var(--text-muted); }
    .life-item .life-time { font-size:0.85rem; color:var(--text-muted); }
    .life-item .life-actions { display:flex; gap:4px; margin-left:auto; }

    .projects-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .project-card {
      background:var(--bg-card); border-radius:var(--radius);
      border:1px solid var(--border); overflow:hidden; box-shadow:var(--shadow-sm);
      transition:all var(--transition);
    }
    .project-card:hover { box-shadow:var(--shadow-md); transform:translateY(-2px); }
    .project-cover { aspect-ratio:16/9; background:var(--border); overflow:hidden; }
    .project-cover img { width:100%; height:100%; object-fit:cover; }
    .project-info { padding:16px 20px 20px; }
    .project-title { font-size:1.15rem; font-weight:600; margin-bottom:4px; color:var(--text); }
    .project-excerpt { font-size:0.95rem; color:var(--text-secondary); line-height:1.6; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .project-tags { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; }
    .project-tags .tag { padding:2px 10px; border-radius:20px; background:var(--border); font-size:0.75rem; color:var(--text-secondary); }
    .project-links { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
    .project-admin-actions { display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:8px; border-top:1px solid var(--border-light); }
    .project-admin-actions .project-status { font-size:0.75rem; padding:2px 10px; border-radius:20px; }
    .project-admin-actions .project-status.status-published { background:var(--success); color:#fff; }
    .project-admin-actions .project-status.status-draft { background:var(--border); color:var(--text-muted); }

    .about-page { max-width:720px; }
    .about-page h1 { font-size:2.2rem; font-weight:700; margin-bottom:32px; }
    .about-section { margin-bottom:40px; }
    .about-section h2 { font-size:1.3rem; font-weight:600; margin-bottom:12px; color:var(--text); }
    .about-section p, .about-section li { color:var(--text-secondary); line-height:1.8; }
    .about-section ul { list-style:none; padding:0; }
    .about-section ul li { padding:4px 0; }
    .skill-path { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:16px 0; }
    .skill-tag { padding:4px 16px; border-radius:20px; background:var(--border); font-size:0.9rem; color:var(--text-secondary); font-weight:500; }
    .skill-arrow { color:var(--text-muted); font-size:1.1rem; }

    .empty-state { padding:32px 0; color:var(--text-muted); text-align:center; }

    .btn {
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 16px; border-radius:6px; font-weight:500; font-size:0.9rem;
      border:1px solid transparent; transition:all var(--transition);
    }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-primary:hover { background:var(--primary-hover); color:#fff; }
    .btn-outline { border-color:var(--border); color:var(--text-secondary); background:transparent; }
    .btn-outline:hover { background:var(--border); color:var(--text); }
    .btn-danger { background:var(--danger); color:#fff; }
    .btn-danger:hover { background:var(--danger-hover); color:#fff; }
    .btn-sm { padding:3px 10px; font-size:0.8rem; }
    .btn-block { width:100%; justify-content:center; }

    .admin-toolbar {
      display:flex; justify-content:space-between; align-items:center;
      flex-wrap:wrap; gap:12px; margin-bottom:20px; padding-bottom:12px;
      border-bottom:1px solid var(--border);
    }
    .admin-stats { font-size:0.85rem; color:var(--text-muted); }

    .toast-container {
      position:fixed; bottom:24px; right:24px; z-index:9999;
      display:flex; flex-direction:column; gap:8px; max-width:360px; width:100%;
    }
    .toast {
      background:var(--bg-card); border:1px solid var(--border);
      padding:12px 18px; border-radius:6px; box-shadow:var(--shadow-lg);
      animation:slideIn 0.3s ease; font-size:0.95rem;
      transition:opacity 0.3s ease, transform 0.3s ease;
    }
    .toast.success { border-left:4px solid var(--success); }
    .toast.error { border-left:4px solid var(--danger); }
    .toast.info { border-left:4px solid var(--primary); }
    @keyframes slideIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

    .loading-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(4px);
      display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9998;
      color:#fff;
    }
    .loading-overlay .loading-spinner {
      width:40px; height:40px; border:4px solid rgba(255,255,255,0.2);
      border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite;
    }
    .loading-overlay p { margin-top:12px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);
      display:flex; align-items:center; justify-content:center; z-index:500; padding:16px;
    }
    .modal-content {
      background:var(--bg-card); border-radius:var(--radius);
      max-width:720px; width:100%; max-height:90vh; overflow-y:auto;
      padding:24px; box-shadow:var(--shadow-lg); border:1px solid var(--border);
    }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .modal-header h3 { font-size:1.3rem; font-weight:600; }
    .modal-close { font-size:1.8rem; color:var(--text-muted); padding:0 8px; line-height:1; }
    .modal-close:hover { color:var(--text); }
    .modal-body { display:flex; flex-direction:column; gap:12px; }
    .modal-body .form-group { display:flex; flex-direction:column; gap:4px; }
    .modal-body .form-group label { font-weight:500; font-size:0.9rem; color:var(--text-secondary); }
    .modal-body input, .modal-body textarea {
      width:100%; padding:10px 14px; border:1px solid var(--border);
      border-radius:6px; background:var(--bg-input); color:var(--text);
      font-size:1rem; font-family:var(--font);
      transition:border-color var(--transition);
    }
    .modal-body input:focus, .modal-body textarea:focus { outline:none; border-color:var(--primary); }
    .modal-body textarea { min-height:200px; resize:vertical; font-family:var(--font-mono); font-size:0.95rem; line-height:1.6; }
    .editor-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .editor-status { display:flex; align-items:center; gap:8px; padding:8px 0; }
    .editor-status label { display:flex; align-items:center; gap:6px; font-size:0.9rem; cursor:pointer; }
    .editor-status input[type="checkbox"] { width:18px; height:18px; accent-color:var(--primary); cursor:pointer; }
    .modal-footer { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; padding-top:12px; border-top:1px solid var(--border); }

    .project-detail-content { font-size:1.05rem; line-height:1.8; color:var(--text-secondary); }
    .project-detail-content h1 { font-size:2rem; font-weight:700; margin:1.5em 0 0.5em; color:var(--text); }
    .project-detail-content h2 { font-size:1.6rem; font-weight:600; margin:1.4em 0 0.5em; color:var(--text); }
    .project-detail-content h3 { font-size:1.3rem; font-weight:600; margin:1.2em 0 0.4em; color:var(--text); }
    .project-detail-content p { margin:0.6em 0; }
    .project-detail-content ul, .project-detail-content ol { padding-left:1.5em; margin:0.6em 0; }
    .project-detail-content li { margin:0.2em 0; }
    .project-detail-content blockquote { border-left:4px solid var(--primary); padding-left:1em; margin:1em 0; color:var(--text-muted); font-style:italic; }
    .project-detail-content code { font-family:var(--font-mono); font-size:0.9em; padding:2px 6px; border-radius:4px; background:var(--border); }
    .project-detail-content pre { background:var(--border); border-radius:6px; padding:16px; overflow-x:auto; margin:1em 0; }
    .project-detail-content pre code { background:none; padding:0; font-size:0.9rem; }
    .project-detail-content a { color:var(--primary); text-decoration:underline; text-underline-offset:2px; }
    .project-detail-content img { max-width:100%; border-radius:6px; margin:0.5em 0; }
    .project-detail-content table { width:100%; border-collapse:collapse; margin:1em 0; }
    .project-detail-content th, .project-detail-content td { border:1px solid var(--border); padding:8px 12px; text-align:left; }
    .project-detail-content th { background:var(--border); font-weight:600; }
    .project-detail-content hr { border:none; border-top:2px solid var(--border); margin:1.5em 0; }

    [data-theme="dark"] .EasyMDEContainer .CodeMirror { background:var(--bg-input); color:var(--text); border-color:var(--border); }
    [data-theme="dark"] .EasyMDEContainer .editor-toolbar { border-color:var(--border); background:var(--bg-card); }
    [data-theme="dark"] .EasyMDEContainer .editor-toolbar button { color:var(--text-secondary); }
    [data-theme="dark"] .EasyMDEContainer .editor-toolbar button:hover { background:var(--border); }
    [data-theme="dark"] .EasyMDEContainer .editor-preview { background:var(--bg-card); color:var(--text); }
    [data-theme="dark"] .hljs { background:var(--bg-input) !important; color:var(--text) !important; }

    @media (max-width:1024px) {
      .main-content { margin-left:0; padding:calc(var(--nav-height) + 16px) 16px 32px; }
      .sidebar { transform:translateX(-100%); }
      .sidebar.open { transform:translateX(0); }
      .top-nav { display:flex; }
      .projects-grid { grid-template-columns:1fr 1fr; }
    }
    @media (max-width:768px) {
      .hero h1 { font-size:2rem; }
      .hero .hero-sub { font-size:1rem; }
      .section-title { font-size:1.3rem; }
      .projects-grid { grid-template-columns:1fr; }
      .post-item { flex-wrap:wrap; }
      .post-item .post-preview { white-space:normal; -webkit-line-clamp:2; -webkit-box-orient:vertical; display:-webkit-box; overflow:hidden; }
      .post-item .post-item-meta { width:100%; justify-content:flex-start; }
      .modal-content { padding:16px; max-width:95%; }
      .modal-body textarea { min-height:150px; }
      .life-images { grid-template-columns:repeat(3,1fr); }
      .admin-toolbar { flex-direction:column; align-items:stretch; }
      .about-page h1 { font-size:1.8rem; }
      .skill-path { gap:6px; }
      .skill-tag { font-size:0.8rem; padding:3px 12px; }
    }
    @media (max-width:480px) {
      .hero h1 { font-size:1.6rem; }
      .project-info { padding:12px; }
      .project-title { font-size:1rem; }
      .post-item { padding:10px 0; }
      .life-item { padding:12px; }
      .modal-body input, .modal-body textarea { font-size:0.9rem; padding:8px 12px; }
      .btn { font-size:0.8rem; padding:5px 12px; }
      .btn-sm { font-size:0.7rem; padding:2px 8px; }
      .toast-container { left:12px; right:12px; bottom:12px; max-width:none; }
    }
  </style>
</head>
<body>

  <!-- ===== 顶部导航（移动端） ===== -->
  <nav class="top-nav">
    <div class="nav-brand"><a href="#home" class="brand-link">阿历</a></div>
    <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
    <ul class="nav-menu" id="navMenu">
      <li><a href="#home" class="active" data-view="home">首页</a></li>
      <li><a href="#about" data-view="about">关于我</a></li>
      <li><a href="#projects" data-view="projects">项目案例</a></li>
      <li><a href="#learning" data-view="learning">学习成长</a></li>
      <li><a href="#life" data-view="life">生活随笔</a></li>
      <li class="theme-toggle"><button id="themeToggle"><i class="fas fa-moon"></i></button></li>
    </ul>
  </nav>

  <!-- ===== 侧边栏（桌面） ===== -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <a href="#home" class="brand-link">阿历</a>
      <span class="brand-sub">数据分析 · 成长博客</span>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li><a href="#home" class="active" data-view="home"><i class="fas fa-home"></i> 首页</a></li>
        <li><a href="#about" data-view="about"><i class="fas fa-user"></i> 关于我</a></li>
        <li><a href="#projects" data-view="projects"><i class="fas fa-code"></i> 项目案例</a></li>
        <li><a href="#learning" data-view="learning"><i class="fas fa-graduation-cap"></i> 学习成长</a></li>
        <li><a href="#life" data-view="life"><i class="fas fa-pen-fancy"></i> 生活随笔</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <button id="themeToggleDesktop"><i class="fas fa-moon"></i></button>
      <span>&copy; 2026 阿历</span>
    </div>
  </aside>

  <!-- ===== 主内容区 ===== -->
  <main class="main-content">
    <section id="view-home" class="view active"><div id="homeContent"></div></section>
    <section id="view-about" class="view"><div id="aboutContent"></div></section>
    <section id="view-projects" class="view"><div id="projectsContent"></div></section>
    <section id="view-learning" class="view"><div id="learningContent"></div></section>
    <section id="view-life" class="view"><div id="lifeContent"></div></section>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <!-- ============================================================
       所有 JavaScript 内联（使用 type="module"）
       合并了 config.js 和 app.js 的所有功能
       ============================================================ -->
  <script type="module">
    // ============================================================
    // 1. Supabase 配置
    // ============================================================
    const SUPABASE_URL = 'https://bqdhqnviozvqljjigzys.supabase.co';
    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZGhxbnZpb3p2cWxqamlnenlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTA4MTYsImV4cCI6MjEwMDI4NjgxNn0.aoFWYdp_9kwB1y741zfnziMYjq7cPnLGCrDApgdmrmE';

    const TABLES = {
      LEARNING: 'learning',
      ESSAYS: 'essays',
      PROJECTS: 'projects'
    };

    // ============================================================
    // 2. 工具函数
    // ============================================================
    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString('zh-CN', {
        year: 'numeric', month: 'short', day: 'numeric'
      });
    }

    function relativeTime(iso) {
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
      if (diff < 604800) return Math.floor(diff / 86400) + '天前';
      return formatDate(iso);
    }

    function showToast(message, type = 'info', duration = 3000) {
      const container = document.getElementById('toastContainer');
      if (!container) {
        console.warn('[Toast] 容器不存在:', message);
        return;
      }
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(20px)';
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function getProjectExcerpt(markdown, maxLen = 150) {
      if (!markdown) return '';
      let text = markdown.replace(/```[\s\S]*?```/g, '');
      text = text
        .replace(/#{1,6}\s/g, '')
        .replace(/\*\*(.+?)\*\*/g, '$1')
        .replace(/\*(.+?)\*/g, '$1')
        .replace(/\[(.+?)\]\(.+?\)/g, '$1')
        .replace(/`(.+?)`/g, '$1')
        .replace(/>\s/g, '')
        .replace(/[-*+]\s/g, '')
        .replace(/\n/g, ' ')
        .trim();
      if (text.length > maxLen) text = text.slice(0, maxLen) + '...';
      return text;
    }

    // ============================================================
    // 3. Supabase 客户端
    // ============================================================
    let _client = null;

    function getSupabaseClient() {
      if (_client) return _client;
      if (typeof supabase === 'undefined' || !supabase.createClient) {
        throw new Error('Supabase SDK 未加载');
      }
      _client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        realtime: { params: { eventsPerSecond: 10 } },
        auth: { persistSession: true }
      });
      return _client;
    }

    // ============================================================
    // 4. 数据层（直接操作 Supabase）
    // ============================================================
    const sb = getSupabaseClient();

    async function fetchLearning(onlyPublished = true) {
      let q = sb.from(TABLES.LEARNING).select('*').order('created_at', { ascending: false });
      if (onlyPublished) q = q.eq('status', 'published');
      const { data, error } = await q;
      if (error) throw error;
      return data || [];
    }

    async function fetchEssays(onlyPublished = true) {
      let q = sb.from(TABLES.ESSAYS).select('*').order('created_at', { ascending: false });
      if (onlyPublished) q = q.eq('is_published', true);
      const { data, error } = await q;
      if (error) throw error;
      return data || [];
    }

    async function fetchProjects(onlyPublished = true) {
      let q = sb.from(TABLES.PROJECTS).select('*').order('created_at', { ascending: false });
      if (onlyPublished) q = q.eq('status', 'published');
      const { data, error } = await q;
      if (error) throw error;
      return data || [];
    }

    // ============================================================
    // 5. Store（全局状态）
    // ============================================================
    const store = {
      learning: [],
      essays: [],
      projects: [],
      listeners: []
    };

    store.subscribe = function(fn) {
      this.listeners.push(fn);
    };

    store.notify = function() {
      this.listeners.forEach(fn => fn());
    };

    // ============================================================
    // 6. Realtime 管理
    // ============================================================
    let realtimeChannels = {};

    function setupRealtime() {
      const tables = [TABLES.LEARNING, TABLES.ESSAYS, TABLES.PROJECTS];

      tables.forEach(table => {
        if (realtimeChannels[table]) {
          realtimeChannels[table].unsubscribe();
        }

        const channel = sb.channel(`app-${table}`)
          .on('postgres_changes', { event: '*', schema: 'public', table }, async (payload) => {
            try {
              if (table === TABLES.LEARNING) {
                store.learning = await fetchLearning(true);
              } else if (table === TABLES.ESSAYS) {
                store.essays = await fetchEssays(true);
              } else if (table === TABLES.PROJECTS) {
                store.projects = await fetchProjects(true);
              }
              store.notify();
              // 如果当前在对应视图，重新渲染
              const viewMap = { learning: 'learning', essays: 'life', projects: 'projects' };
              const view = viewMap[table];
              if (view && currentView === view) renderView(view);
              if (currentView === 'home') renderHome();
            } catch (e) {
              console.warn('[Realtime] 刷新失败:', e);
            }
          })
          .subscribe((status) => {
            if (status === 'CHANNEL_ERROR') {
              console.warn(`[Realtime] ${table} 重连...`);
              setTimeout(setupRealtime, 5000);
            }
          });

        realtimeChannels[table] = channel;
      });
    }

    // ============================================================
    // 7. 渲染函数
    // ============================================================

    function renderHome() {
      const container = document.getElementById('homeContent');
      if (!container) return;

      const learning = store.learning.slice(0, 3);
      const projects = store.projects.slice(0, 2);

      let html = `
        <section class="hero">
          <h1>👋 你好，我是阿历</h1>
          <p class="hero-sub">从市场运营到数据驱动 · 用 SQL 和 Python 解答业务问题</p>
          <p class="hero-desc">记录我的数据分析学习与实践，分享项目案例与思考。</p>
        </section>
        <section class="section">
          <h2 class="section-title">📖 最新学习</h2>
          <div class="post-list">
      `;
      if (learning.length === 0) {
        html += `<p class="empty-state">还没有学习笔记。</p>`;
      } else {
        learning.forEach(item => {
          html += `<div class="post-item"><span class="post-title">${escapeHtml(item.title)}</span><span class="post-meta">${relativeTime(item.created_at)}</span></div>`;
        });
      }
      html += `</div></section><section class="section"><h2 class="section-title">🚀 精选项目</h2><div class="projects-grid">`;
      if (projects.length === 0) {
        html += `<p class="empty-state">暂无项目。</p>`;
      } else {
        projects.forEach(item => {
          const cover = item.cover_image ? `<img src="${item.cover_image}" alt="${escapeHtml(item.title)}" loading="lazy" />` : '';
          html += `
            <div class="project-card">
              <div class="project-cover">${cover}</div>
              <div class="project-info">
                <h3 class="project-title">${escapeHtml(item.title)}</h3>
                <p class="project-excerpt">${escapeHtml(getProjectExcerpt(item.description, 120))}</p>
              </div>
            </div>
          `;
        });
      }
      html += `</div></section><section class="section"><h2 class="section-title">📌 关于我</h2>
        <p>我曾从事市场运营，现在专注于数据分析。</p>
        <p><strong>学习路径：</strong> Excel → SQL → Power BI → Python → 机器学习</p>
        <p><a href="#about" class="link-more">了解更多 →</a></p>
      </section>`;
      container.innerHTML = html;
    }

    function renderAbout() {
      const container = document.getElementById('aboutContent');
      if (!container) return;
      container.innerHTML = `
        <article class="about-page">
          <h1>关于我</h1>
          <section class="about-section"><h2>我的转型故事</h2>
            <p>我曾从事市场运营，在与数据打交道的过程中发现数据背后隐藏着业务增长的密码。于是我开始系统学习数据分析，从 Excel 到 SQL，从 Power BI 到 Python，逐步完成转型。</p>
            <p><strong>数据不是冰冷的数字，而是业务最真实的语言。</strong></p>
          </section>
          <section class="about-section"><h2>我的学习路径</h2>
            <div class="skill-path">
              <span class="skill-tag">Excel</span><span class="skill-arrow">→</span>
              <span class="skill-tag">SQL</span><span class="skill-arrow">→</span>
              <span class="skill-tag">Power BI</span><span class="skill-arrow">→</span>
              <span class="skill-tag">Python</span><span class="skill-arrow">→</span>
              <span class="skill-tag">机器学习</span>
            </div>
          </section>
          <section class="about-section"><h2>我正在做的事</h2>
            <ul><li>📊 搭建 RFM 用户分层分析看板</li><li>📈 复购归因与留存分析实战</li><li>🧪 A/B 测试设计与效果评估</li><li>📝 持续输出数据分析学习笔记</li></ul>
          </section>
        </article>
      `;
    }

    function renderLearning() {
      const container = document.getElementById('learningContent');
      if (!container) return;
      const items = store.learning;
      if (items.length === 0) {
        container.innerHTML = `<p class="empty-state">还没有学习笔记。</p>`;
        return;
      }
      let html = `<div class="post-list">`;
      items.forEach(item => {
        const preview = (item.content || '').replace(/[#*`\[\]]/g, '').slice(0, 150);
        html += `
          <div class="post-item">
            <div class="post-item-main">
              <span class="post-title">${escapeHtml(item.title)}</span>
              <span class="post-preview">${escapeHtml(preview)}...</span>
            </div>
            <span class="post-meta">${relativeTime(item.created_at)}</span>
          </div>
        `;
      });
      html += `</div>`;
      container.innerHTML = html;
    }

    function renderLife() {
      const container = document.getElementById('lifeContent');
      if (!container) return;
      const items = store.essays;
      if (items.length === 0) {
        container.innerHTML = `<p class="empty-state">还没有生活随笔。</p>`;
        return;
      }
      let html = `<div class="life-list">`;
      items.forEach(item => {
        const preview = (item.content || '').replace(/[#*`\[\]]/g, '').slice(0, 120);
        const images = (item.images || []).slice(0, 3);
        const imgHtml = images.length ? `<div class="life-images">${images.map(img => `<img src="${img}" loading="lazy" />`).join('')}</div>` : '';
        html += `
          <div class="life-item">
            <div class="life-item-content"><p class="life-text">${escapeHtml(preview)}...</p>${imgHtml}</div>
            <div class="life-item-meta"><span class="life-time">${relativeTime(item.created_at)}</span></div>
          </div>
        `;
      });
      html += `</div>`;
      container.innerHTML = html;
    }

    function renderProjects() {
      const container = document.getElementById('projectsContent');
      if (!container) return;
      const items = store.projects;
      if (items.length === 0) {
        container.innerHTML = `<p class="empty-state">暂无项目。</p>`;
        return;
      }
      let html = `<div class="projects-grid">`;
      items.forEach(item => {
        const cover = item.cover_image ? `<img src="${item.cover_image}" alt="${escapeHtml(item.title)}" loading="lazy" />` : '';
        const tags = (item.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
        html += `
          <div class="project-card">
            <div class="project-cover">${cover}</div>
            <div class="project-info">
              <h3 class="project-title">${escapeHtml(item.title)}</h3>
              <p class="project-excerpt">${escapeHtml(getProjectExcerpt(item.description, 120))}</p>
              <div class="project-tags">${tags}</div>
            </div>
          </div>
        `;
      });
      html += `</div>`;
      container.innerHTML = html;
    }

    // ============================================================
    // 8. 路由
    // ============================================================
    let currentView = 'home';
    const viewMap = {
      home: renderHome,
      about: renderAbout,
      learning: renderLearning,
      life: renderLife,
      projects: renderProjects
    };

    function renderView(view) {
      if (viewMap[view]) viewMap[view]();
    }

    function navigate(view) {
      currentView = view;
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(`view-${view}`);
      if (target) target.classList.add('active');
      document.querySelectorAll('.sidebar-nav a, .nav-menu a').forEach(link => {
        link.classList.toggle('active', link.dataset.view === view);
      });
      renderView(view);
      if (window.location.hash !== `#${view}`) {
        history.pushState(null, '', `#${view}`);
      }
    }

    // ============================================================
    // 9. 初始化
    // ============================================================
    async function initApp() {
      // 主题
      const html = document.documentElement;
      const theme = localStorage.getItem('theme') || 'light';
      html.setAttribute('data-theme', theme);
      document.querySelectorAll('#themeToggle, #themeToggleDesktop').forEach(btn => {
        btn.addEventListener('click', () => {
          const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          html.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
        });
      });

      // 加载数据
      try {
        const [learning, essays, projects] = await Promise.all([
          fetchLearning(true), fetchEssays(true), fetchProjects(true)
        ]);
        store.learning = learning;
        store.essays = essays;
        store.projects = projects;
      } catch (e) {
        showToast('数据加载失败', 'error');
        console.error(e);
      }

      // Store 订阅
      store.subscribe(() => {
        if (currentView === 'home') renderHome();
        else renderView(currentView);
      });

      // Realtime
      setupRealtime();

      // 导航点击
      document.querySelectorAll('.sidebar-nav a, .nav-menu a').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const view = link.dataset.view;
          if (view) navigate(view);
        });
      });

      // Hash 变化
      window.addEventListener('hashchange', () => {
        const view = window.location.hash.replace('#', '') || 'home';
        if (viewMap[view]) navigate(view);
      });

      // 移动端菜单
      const hamburger = document.getElementById('hamburger');
      const menu = document.getElementById('navMenu');
      if (hamburger && menu) {
        hamburger.addEventListener('click', () => menu.classList.toggle('open'));
        menu.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => menu.classList.remove('open'));
        });
      }

      // 初始导航
      const hash = window.location.hash.replace('#', '') || 'home';
      if (viewMap[hash]) navigate(hash);
      else navigate('home');

      console.log('[App] 初始化完成');
    }

    // ============================================================
    // 10. 启动
    // ============================================================
    if (document.readyState === 'complete') {
      initApp();
    } else {
      window.addEventListener('load', initApp);
    }
  </script>
