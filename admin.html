<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理 · 阿历</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- ===== 顶部导航 ===== -->
  <nav class="top-nav">
    <div class="nav-brand"><span class="brand-link">阿历 · 管理</span></div>
    <div class="nav-actions">
      <span id="adminUser" style="font-size:0.9rem;margin-right:1rem;"></span>
      <button id="logoutBtn" class="btn btn-outline">登出</button>
      <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
    </div>
    <ul class="nav-menu" id="navMenu">
      <li><a href="#learning" class="active" data-view="learning">学习成长</a></li>
      <li><a href="#life" data-view="life">生活随笔</a></li>
      <li><a href="#projects" data-view="projects">项目案例</a></li>
      <li><a href="#home" data-view="home">首页预览</a></li>
      <li class="theme-toggle"><button id="themeToggle"><i class="fas fa-moon"></i></button></li>
    </ul>
  </nav>

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="brand-link">阿历 · 管理</span></div>
    <nav class="sidebar-nav">
      <ul>
        <li><a href="#learning" class="active" data-view="learning"><i class="fas fa-graduation-cap"></i> 学习成长</a></li>
        <li><a href="#life" data-view="life"><i class="fas fa-pen-fancy"></i> 生活随笔</a></li>
        <li><a href="#projects" data-view="projects"><i class="fas fa-code"></i> 项目案例</a></li>
        <li><a href="#home" data-view="home"><i class="fas fa-eye"></i> 首页预览</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <span id="adminUserSidebar"></span>
      <button id="logoutBtnSidebar" class="btn btn-sm btn-outline">登出</button>
      <button id="themeToggleDesktop"><i class="fas fa-moon"></i></button>
    </div>
  </aside>

  <!-- ===== 主内容 ===== -->
  <main class="main-content">
    <section id="view-home" class="view"><div id="homeContent"></div></section>
    <section id="view-learning" class="view active"><div id="learningContent"></div></section>
    <section id="view-life" class="view"><div id="lifeContent"></div></section>
    <section id="view-projects" class="view"><div id="projectsContent"></div></section>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <!-- ===== 编辑器 Modal ===== -->
  <div id="editorModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="editorTitle">新建文章</h3>
        <button class="modal-close" id="editorClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>标题</label>
          <input type="text" id="editorTitleInput" placeholder="请输入标题" />
        </div>
        <div class="form-group">
          <label>内容 (Markdown)</label>
          <textarea id="editorMarkdown" placeholder="使用 Markdown 写作..."></textarea>
        </div>
        <div class="editor-actions">
          <button id="uploadImageBtn" class="btn btn-sm"><i class="fas fa-image"></i> 上传图片</button>
          <input type="file" id="imageFileInput" accept="image/*" style="display:none;" multiple />
          <span style="font-size:0.8rem;color:var(--text-muted);">支持 jpg/png/gif</span>
        </div>
        <div class="editor-status">
          <label><input type="checkbox" id="editorPublished" /> 发布 (草稿则不勾选)</label>
          <span id="editorStatusText" style="font-size:0.9rem;color:var(--text-muted);">草稿</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="editorCancel">取消</button>
        <button class="btn btn-primary" id="editorSave">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 登录 Modal ===== -->
  <div id="loginModal" class="modal-overlay" style="display:flex;">
    <div class="modal-content" style="max-width:400px;">
      <div class="modal-header"><h3>管理员登录</h3></div>
      <div class="modal-body">
        <form id="loginForm">
          <div class="form-group"><label>邮箱</label><input type="email" id="loginEmail" required /></div>
          <div class="form-group"><label>密码</label><input type="password" id="loginPassword" required /></div>
          <div id="loginError" style="color:var(--danger);display:none;margin-top:8px;"></div>
          <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ===== JS ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "marked": "https://cdn.jsdelivr.net/npm/marked@12.0.0/+esm",
      "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.1.6/+esm"
    }
  }
  </script>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
